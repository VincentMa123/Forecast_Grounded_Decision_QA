ENV:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NPROC_PER_NODE: 4 #remove when using single GPU

model: Qwen/Qwen3.5-9B
use_hf: false
output_dir: pipeclaw/student_distillation/outputs/qwen35_9b_trace_level_benchmark
add_version: false

dataset:
  - pipeclaw/student_distillation/data/trace_level/train.jsonl
val_dataset:
  - pipeclaw/student_distillation/data/trace_level/valid.jsonl
split_dataset_ratio: 0.0
load_from_cache_file: true
dataset_num_proc: 4

tuner_type: lora
target_modules:
  - all-linear
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
freeze_vit: true
freeze_aligner: true

quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
torch_dtype: bfloat16
attn_impl: flash_attn

# 100% of the released records fit in 16,384 tokens (trace-level maximum 12,136)
max_length: 16384
truncation_strategy: delete
loss_scale: default+ignore_empty_think
add_non_thinking_prefix: true
packing: true

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8  # set 32 if using single GPU
gradient_checkpointing: true
deepspeed: zero2 # dont use this when using a single GPU
optim: adamw_torch
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_steps: 20

eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 20
save_total_limit: 1
save_only_model: false
safe_serialization: true
resume_only_model: false
ignore_data_skip: false

logging_steps: 1
logging_first_step: true
include_num_input_tokens_seen: true
report_to: tensorboard
dataloader_num_workers: 4

seed: 42
data_seed: 42
push_to_hub: false
