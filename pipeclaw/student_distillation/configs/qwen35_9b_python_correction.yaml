# Low-cost continuation run for Python tool-call recovery.
# Start from the best existing rank-32 adapter with:
#
#   swift sft pipeclaw/task2_student/configs/qwen35_9b_python_correction.yaml \
#     --resume_from_checkpoint "$CKPT"
#
# resume_only_model starts a fresh optimizer and scheduler over the corrected
# dataset instead of continuing the old data cursor.
ENV:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NPROC_PER_NODE: 1

model: Qwen/Qwen3.5-9B
use_hf: false
output_dir: pipeclaw/task2_student/outputs/qwen35_9b_python_correction
add_version: false

dataset:
  - pipeclaw/task2_student/data/python_correction/train.jsonl
val_dataset:
  - pipeclaw/task2_student/data/python_correction/valid.jsonl
split_dataset_ratio: 0.0
load_from_cache_file: false
dataset_num_proc: 4

tuner_type: lora
target_modules:
  - all-linear
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
freeze_vit: true
freeze_aligner: true

quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
torch_dtype: bfloat16
attn_impl: flash_attention_2

# Regenerate the token profile after syncing this release. Do not train if any
# correction record exceeds this fail-closed ceiling.
max_length: 24576
truncation_strategy: delete
loss_scale: default+ignore_empty_think
add_non_thinking_prefix: true
packing: false
use_liger_kernel: true

# Use an explicit budget so the paid run cannot silently become shorter or longer.
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
optim: adamw_torch
learning_rate: 0.00002
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_steps: 200

eval_strategy: steps
eval_steps: 10
save_strategy: steps
save_steps: 10
save_total_limit: 3
save_only_model: false
safe_serialization: true
resume_only_model: true
ignore_data_skip: true

logging_steps: 1
logging_first_step: true
include_num_input_tokens_seen: true
report_to: tensorboard
dataloader_num_workers: 4

seed: 42
data_seed: 42
push_to_hub: false
