# Remote server main experiment: Qwen3.5-9B, trace-level projection, 4-bit QLoRA,
# lossless 16,384-token context, multi-GPU with DeepSpeed ZeRO-2.
#
#   swift sft pipeclaw/task2_student/configs/qwen35_9b_remote_trace_level.yaml
#
# Run qwen35_9b_remote_benchmark_step20.yaml first: it is the same configuration
# capped at 20 steps and tells you peak VRAM and tokens/sec, which is what the
# rental cost estimate is based on.
#
# Multi-GPU: NPROC_PER_NODE makes `swift sft` launch torch.distributed.run, and
# ZeRO-2 shards optimizer state and gradients across those ranks. Set it to the
# number of visible GPUs (MS-SWIFT rejects DeepSpeed when a single process holds a
# device_map-sharded model). DeepSpeed is not in environment.yml because it is
# source-only; on a host with nvcc install it after `conda activate task2-ms-swift`:
#
#   python -m pip install -U --no-build-isolation \
#     "causal-conv1d>=1.6.2" "flash-attn==2.8.3" "deepspeed>=0.18.9"
#
# Single GPU instead: delete NPROC_PER_NODE and `deepspeed`, then set
# gradient_accumulation_steps to 32 to keep the same effective batch size.
#
# ZeRO stage: keep zero2. ZeRO-3 shards base weights and does not work with
# bitsandbytes 4-bit quantized parameters; use zero2_offload only if the optimizer
# state does not fit.
#
# Other projections: change the two dataset paths and output_dir to answer_only or
# constraint_multitask. Keep every other value identical so the comparison holds
# the training recipe constant.
ENV:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NPROC_PER_NODE: 4

model: Qwen/Qwen3.5-9B
use_hf: false
output_dir: pipeclaw/task2_student/outputs/qwen35_9b_trace_level
add_version: false

dataset:
  - pipeclaw/task2_student/data/trace_level/train.jsonl
val_dataset:
  - pipeclaw/task2_student/data/trace_level/valid.jsonl
split_dataset_ratio: 0.0
load_from_cache_file: true
dataset_num_proc: 4

tuner_type: lora
target_modules:
  - all-linear
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
freeze_vit: true
freeze_aligner: true

quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
torch_dtype: bfloat16
attn_impl: flash_attn

# 100% of the released records fit in 16,384 tokens (trace-level maximum 12,136),
max_length: 16384
truncation_strategy: delete
loss_scale: default+ignore_empty_think
add_non_thinking_prefix: true
packing: false

# 4 ranks x 1 x 8 = effective batch size 32. 902 train records x 3 epochs is
# roughly 84 optimizer steps.
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
deepspeed: zero2
optim: adamw_torch
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
num_train_epochs: 3

eval_strategy: steps
eval_steps: 10
save_strategy: steps
save_steps: 10
save_total_limit: 3
save_only_model: false
safe_serialization: true
resume_only_model: false
ignore_data_skip: false

logging_steps: 1
logging_first_step: true
include_num_input_tokens_seen: true
report_to: tensorboard
dataloader_num_workers: 4

seed: 42
data_seed: 42
push_to_hub: false
